<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Desenhe paredes, portas e janelas e explore a planta em 3D.">
<title>Traço Planta</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" data-icon="brand"></span><span class="brand-name">Traço<span>Planta</span></span></div>
  <label class="project"><input id="project-name" aria-label="Nome do projeto" maxlength="70"></label>
  <div class="view-toggle" aria-label="Modo de visualização">
    <button id="plan-button" aria-label="Planta 2D" aria-pressed="true"><i data-icon="plan"></i> <span>2D</span></button>
    <button id="model-button" aria-label="Vista 3D" aria-pressed="false"><i data-icon="cube"></i> <span>3D</span></button>
  </div>
  <div class="top-actions">
    <span id="save-status" class="save-status" role="status"></span>
    <button id="new" class="plain" title="Novo projeto" aria-label="Novo projeto"><i data-icon="file"></i><span>Novo projeto</span></button>
  </div>
</header>
<main>
  <aside class="tools" aria-label="Ferramentas">
    <div class="tool-list">
      <button aria-keyshortcuts="V" data-tool="select" aria-label="Selecionar" title="Selecionar (V)" aria-pressed="true"><i data-icon="cursor"></i><kbd aria-hidden="true">V</kbd></button>
      <button aria-keyshortcuts="P" data-tool="wall" aria-label="Parede" title="Parede (P)" aria-pressed="false"><i data-icon="wall"></i><kbd aria-hidden="true">P</kbd></button>
      <button aria-keyshortcuts="D" data-tool="door" aria-label="Porta" title="Porta (D)" aria-pressed="false"><i data-icon="door"></i><kbd aria-hidden="true">D</kbd></button>
      <button aria-keyshortcuts="J" data-tool="window" aria-label="Janela" title="Janela (J)" aria-pressed="false"><i data-icon="window"></i><kbd aria-hidden="true">J</kbd></button>
      <button aria-keyshortcuts="R" data-tool="measure" aria-label="Medir" title="Medir (R)" aria-pressed="false"><i data-icon="measure"></i><kbd aria-hidden="true">R</kbd></button>
      <button aria-keyshortcuts="M" data-tool="pan" aria-label="Mover vista" title="Mover vista (M)" aria-pressed="false"><i data-icon="hand"></i><kbd aria-hidden="true">M</kbd></button>
    </div>
    <div class="item-tool">
      <button id="magnetism" aria-pressed="true" aria-keyshortcuts="G" aria-label="Magnetismo" title="Magnetismo ligado (G)"><i data-icon="magnet"></i><kbd aria-hidden="true">G</kbd></button>
      <button id="items-toggle" aria-expanded="false" aria-controls="items" aria-keyshortcuts="I" aria-label="Itens" title="Itens (I)"><i data-icon="list"></i><kbd aria-hidden="true">I</kbd></button>
    </div>
    <div class="history">
      <button id="undo" title="Desfazer (⌘/Ctrl + Z)" aria-label="Desfazer"><i data-icon="undo"></i></button>
      <button id="redo" title="Refazer (⌘/Ctrl + Shift + Z)" aria-label="Refazer"><i data-icon="redo"></i></button>
    </div>
  </aside>
  <section class="workspace" aria-label="Editor de planta">
    <div class="stage" id="stage">
      <canvas id="plan" aria-label="Área de desenho da planta"></canvas>
      <div id="model" hidden aria-label="Modelo em três dimensões"></div>
      <div id="empty" class="empty" hidden><i data-icon="plan"></i><strong>Planta em branco</strong><span>Escolha Parede para começar a desenhar.</span></div>
      <div class="orientation" id="orientation"><b>N</b><i data-icon="north"></i></div>
      <aside id="items" class="items" aria-labelledby="items-title" hidden>
        <div class="inspector-head"><h2 id="items-title">Itens</h2><button id="close-items" aria-label="Fechar itens" title="Fechar itens"><i data-icon="close"></i></button></div>
        <div class="item-tabs" aria-label="Conteúdo da lista">
          <button id="placed-items" aria-pressed="true">Na planta</button>
          <button id="catalog-items" aria-pressed="false">Adicionar</button>
        </div>
        <div id="item-list"></div>
      </aside>
      <aside id="inspector" class="inspector" aria-labelledby="inspector-title" hidden>
        <div class="inspector-head"><h2 id="inspector-title">Propriedades</h2><button id="close-properties" aria-label="Fechar propriedades" title="Fechar propriedades"><i data-icon="close"></i></button></div>
        <div id="properties"></div>
      </aside>
      <div class="camera">
        <button id="fit" title="Enquadrar planta" aria-label="Enquadrar planta"><i data-icon="fit"></i></button>
        <span class="zoom-group"><button id="zoom-out" aria-label="Diminuir zoom"><i data-icon="minus"></i></button><output id="zoom">100%</output><button id="zoom-in" aria-label="Aumentar zoom"><i data-icon="plus"></i></button></span>
      </div>
      <div id="scale-bar"><span></span>1 m</div>
    </div>
    <footer class="workspace-foot"><strong id="mode"></strong><span id="hint" aria-live="polite"></span><span id="project-count"></span></footer>
  </section>
</main>
<dialog id="new-dialog"><form method="dialog"><h2>Novo projeto</h2><p>Escolha a planta padrão ou comece em branco. Use Desfazer para voltar à planta atual antes de recarregar.</p><div><button value="cancel" class="plain">Cancelar</button><button value="blank" class="plain">Em branco</button><button value="template" class="primary">Usar planta padrão</button></div></form></dialog>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./app.mjs"></script>
</body>
</html>
